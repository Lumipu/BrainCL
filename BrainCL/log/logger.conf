[loggers]
keys=root,file,console,fileConsole

[logger_root]
level=DEBUG
handlers=consoleHandler

[logger_file]
level=DEBUG
handlers=fileHandler
qualname=file
propagate=0

[logger_console]
level=DEBUG
handlers=consoleHandler
qualname=console
propagate=0

[logger_fileConsole]
level=DEBUG
handlers=consoleHandler,fileHandler
qualname=fileConsole
propagate=0

[handlers]
keys=consoleHandler,fileHandler

[handler_consoleHandler]
class=StreamHandler
level=DEBUG
formatter=simpleFormatter
args=(sys.stdout,)

[handler_fileHandler]
class=FileHandler
level=DEBUG
formatter=simpleFormatter
args=('./log/record/myrecord.log','w','utf-8')

[formatters]
keys=simpleFormatter

[formatter_simpleFormatter]
format=%(message)s
